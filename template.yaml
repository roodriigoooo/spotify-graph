AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Spotify Similarity Graph - Serverless Architecture

Parameters:
  SpotifyClientId:
    Type: String
    Description: Spotify API Client ID
    NoEcho: false

  SpotifyClientSecret:
    Type: String
    Description: Spotify API Client Secret
    NoEcho: true

  JWTSecret:
    Type: String
    Description: Secret key for JWT token signing
    NoEcho: true

  HuggingFaceApiKey:
    Type: String
    Description: HuggingFace Inference API key for lyric embeddings
    NoEcho: true

  FrontendUrl:
    Type: String
    Description: Public URL of the frontend (used as post-login redirect)
    Default: https://overlappingechoes.app
    # NOTE: this must match the actual hosted frontend URL, or Spotify OAuth will redirect to a dead link

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Layers:
      - !Ref CommonLayer
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        FRIENDS_TABLE: !Ref FriendsTable
        FRIEND_REQUESTS_TABLE: !Ref FriendRequestsTable
        MUSIC_PROFILES_TABLE: !Ref MusicProfilesTable
        PLAY_EVENTS_TABLE: !Ref PlayEventsTable
        TRACK_EMBEDDINGS_TABLE: !Ref TrackEmbeddingsTable
        SPOTIFY_CLIENT_ID: !Ref SpotifyClientId
        SPOTIFY_CLIENT_SECRET: !Ref SpotifyClientSecret
        JWT_SECRET: !Ref JWTSecret
        FRONTEND_CALLBACK_URL: !Ref FrontendUrl

Resources:
  # ============================================
  # Shared Lambda Layer
  # ============================================
  # One source of truth for the hand-written `common/` package (utils + the v2 `taste`
  # engine) and the few third-party deps not already in the runtime (requests, PyJWT).
  # boto3/botocore ship with the python3.12 runtime, so they are NOT vendored. This
  # replaces the old pattern of copying `common/` (and all of boto3) into all 7 functions.
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: SpotifyQueue-Common
      Description: Shared common/ package (utils + taste engine) and runtime deps
      ContentUri: layers/common/
      CompatibleRuntimes:
        - python3.12
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.12

  # ============================================
  # DynamoDB Tables
  # ============================================

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: spotifyId
          AttributeType: S
        - AttributeName: visibility
          AttributeType: S
        - AttributeName: lastLogin
          AttributeType: N
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: SpotifyIdIndex
          KeySchema:
            - AttributeName: spotifyId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: RecentActivityIndex
          KeySchema:
            - AttributeName: visibility
              KeyType: HASH
            - AttributeName: lastLogin
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  FriendsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-Friends
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: friendId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: friendId
          KeyType: RANGE

  FriendRequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-FriendRequests
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: requestId
          AttributeType: S
        - AttributeName: toUserId
          AttributeType: S
        - AttributeName: fromUserId
          AttributeType: S
      KeySchema:
        - AttributeName: requestId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ToUserIndex
          KeySchema:
            - AttributeName: toUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: FromUserIndex
          KeySchema:
            - AttributeName: fromUserId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MusicProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-MusicProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      # Stream lets a downstream consumer react to profile changes (e.g. invalidate a
      # cached graph, recompute facet calibration) without polling.
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # PlayEvents — the continuous listening footprint (taste-engine v2). One row per play,
  # aggregated with a recency half-life rather than read as a top-N snapshot. The sort key
  # is "<playedAtEpochMs>#<trackId>" so a user's history reads back newest-first and each
  # play is unique. Old rows self-expire via the `ttl` attribute to bound storage.
  PlayEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-PlayEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # TrackEmbeddings — a shared cache of per-track lyric embeddings (whitened offline).
  # Keyed by trackId so the (rate-limited, paid) embedding call happens once per track and
  # is reused across every user who plays it. `ttl` lets stale rows lapse if a model rolls.
  TrackEmbeddingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: SpotifyQueue-TrackEmbeddings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: trackId
          AttributeType: S
      KeySchema:
        - AttributeName: trackId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ============================================
  # CloudFront Distribution for Frontend
  # ============================================

  # Private hosting bucket, readable only by the distribution via Origin Access Control.
  # (The old spotify-queue-demo-hosting bucket lived in a since-closed AWS account.)
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'overlapping-echoes-hosting-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Spotify Graph Frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: S3StaticWebsite
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref FrontendOriginAccessControl
        # S3 REST origin answers 403 (not 404) for keys that don't exist; serve the app
        # shell instead so stray paths land in the SPA. Short TTL so real permission
        # errors don't stick.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 60
        DefaultCacheBehavior:
          TargetOriginId: S3StaticWebsite
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          # Origin Cache-Control governs: the deploy ships hashed assets as
          # max-age=31536000,immutable and index.html as no-cache. MaxTTL must not cap the
          # immutable assets (the old 300s did, forcing an S3 refetch every 5 minutes), and
          # static assets don't vary by query string — forwarding it only fragments the cache.
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000

  # ============================================
  # REST API Gateway
  # ============================================

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: SpotifyQueue-RestApi
      StageName: prod
      # gzip responses over 1KB — /graph ships nodes + per-edge facet breakdowns + genre
      # summaries as JSON, which compresses ~5-10x. Cuts transfer cost and time to render.
      MinimumCompressionSize: 1024
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Auth-Token'"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowCredentials: false
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Auth-Token'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: "'*'"
              Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token,X-Auth-Token'"
      Auth:
        DefaultAuthorizer: JWTAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          JWTAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers:
                - X-Auth-Token
            AuthorizerResultTtlInSeconds: 300

  # ============================================
  # Lambda Functions - Authentication
  # ============================================

  HealthCheckFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-HealthCheck
      CodeUri: src/health/
      Handler: health_check.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-Authorizer
      CodeUri: src/auth/
      Handler: authorizer.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  SpotifyAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-SpotifyAuth
      CodeUri: src/auth/
      Handler: spotify_auth.handler
      Events:
        AuthUrl:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /auth/spotify
            Method: GET
            Auth:
              Authorizer: NONE
        AuthCallback:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /auth/callback
            Method: GET
            Auth:
              Authorizer: NONE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ============================================
  # Lambda Functions - User Management
  # ============================================

  GetMeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-GetMe
      CodeUri: src/users/
      Handler: get_me.handler
      Events:
        GetMe:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  UpdateVisibilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-UpdateVisibility
      CodeUri: src/users/
      Handler: update_visibility.handler
      Events:
        UpdateVisibility:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/visibility
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  SetHistoryConsentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-SetHistoryConsent
      CodeUri: src/users/
      Handler: set_history_consent.handler
      Events:
        SetHistoryConsent:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/history-consent
            Method: PUT
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ============================================
  # Lambda Functions - Friend Management
  # ============================================

  SendFriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-SendFriendRequest
      CodeUri: src/friends/
      Handler: send_request.handler
      Events:
        SendRequest:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /friends/request
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendRequestsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable

  ListFriendRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-ListFriendRequests
      CodeUri: src/friends/
      Handler: list_requests.handler
      Events:
        ListRequests:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /friends/requests
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FriendRequestsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  AcceptFriendRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-AcceptFriendRequest
      CodeUri: src/friends/
      Handler: accept_request.handler
      Events:
        AcceptRequest:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /friends/accept
            Method: POST
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendRequestsTable

  DeleteFriendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-DeleteFriend
      CodeUri: src/friends/
      Handler: delete_friend.handler
      Events:
        DeleteFriend:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /friends/{friendId}
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FriendsTable

  ListFriendsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-ListFriends
      CodeUri: src/friends/
      Handler: list_friends.handler
      Events:
        ListFriends:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /friends
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable

  # ============================================
  # Lambda Functions - Music Profiles
  # ============================================

  UpdateMusicProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-UpdateMusicProfile
      CodeUri: src/profiles/
      Handler: update_profile.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          COMPUTE_LYRIC_FUNCTION_ARN: !GetAtt ComputeLyricProfileFunction.Arn
      Events:
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/profile/refresh
            Method: POST
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MusicProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayEventsTable
        - Statement:
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ComputeLyricProfileFunction.Arn

  ComputeLyricProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-ComputeLyricProfile
      CodeUri: src/profiles/
      Handler: compute_lyric_profile.handler
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          HUGGINGFACE_API_KEY: !Ref HuggingFaceApiKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref MusicProfilesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref TrackEmbeddingsTable

  GetProfileStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-GetProfileStatus
      CodeUri: src/profiles/
      Handler: get_profile_status.handler
      Timeout: 10
      Events:
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /me/profile
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MusicProfilesTable

  # IngestPlays — continuous footprint ingestion (taste-engine v2). Runs on a schedule over
  # every consenting user, and can also be invoked directly with {"userId": ...}.
  IngestPlaysFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-IngestPlays
      CodeUri: src/profiles/
      Handler: ingest_plays.handler
      Timeout: 300
      MemorySize: 512
      Events:
        ScheduledIngest:
          Type: Schedule
          Properties:
            Schedule: rate(6 hours)
            Description: Append consenting users' recent plays to PlayEvents
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayEventsTable

  # ============================================
  # Lambda Functions - Similarity Graph
  # ============================================

  GetGraphFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SpotifyQueue-GetGraph
      CodeUri: src/graph/
      Handler: get_graph.handler
      Timeout: 15
      # CPU scales with memory on Lambda; pairwise WMD/Sinkhorn in pure Python is CPU-bound,
      # so 512MB halves (or better) the duration — usually net cheaper than 256MB, and the
      # warm-container score memo (get_graph._SCORE_CACHE) lives longer per dollar.
      MemorySize: 512
      Events:
        GetGraph:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /graph
            Method: GET
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref FriendsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MusicProfilesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PlayEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref TrackEmbeddingsTable

Outputs:
  RestApiUrl:
    Description: REST API Gateway endpoint URL
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/prod/'

  FrontendUrl:
    Description: HTTPS entrypoint for the static frontend
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
